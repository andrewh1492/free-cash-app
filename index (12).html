<style>
:root{--bg:#f5f6f2;--card:#fff;--ink:#1b231f;--muted:#6a746e;--line:#e2e6df;--brand:#166534;--brand2:#e3f6e8;--pos:#15803d;--neg:#b91c1c;--warn:#b45309;--chip:#edf1ea;--shadow:0 1px 2px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1311;--card:#17201b;--ink:#e6ebe7;--muted:#93a097;--line:#29332d;--brand:#22c55e;--brand2:#143020;--pos:#4ade80;--neg:#f87171;--warn:#fbbf24;--chip:#212b25;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:680px;margin:0 auto}
.top .logo{width:32px;height:32px}
.top h1{font-size:19px;margin:0;flex:1;letter-spacing:-.01em}
#syncBtn{display:none;font-size:12px;padding:5px 10px;border-radius:99px;background:var(--chip);border:none;color:var(--muted);white-space:nowrap}
#syncBtn.ok{color:var(--pos)}#syncBtn.err{color:var(--neg);background:color-mix(in srgb,var(--neg) 12%,transparent)}
#syncBtn.busy{color:var(--warn)}
main{max-width:680px;margin:0 auto;padding:4px 16px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px;font-weight:650}
.card .card{box-shadow:none}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cardhead h2{margin:0}
.big{font-size:30px;font-weight:750;letter-spacing:-.02em;margin:2px 0}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.muted{color:var(--muted)}
small,.hint{color:var(--muted);font-size:12.5px}
.hint{margin:6px 0}
button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){button.primary{color:#06130b}}
button.danger{color:var(--neg)}
button.wide{width:100%;margin-top:6px}
button.link{background:none;border:none;padding:4px 0;color:var(--brand);font-weight:600}
button.icon{background:none;border:none;padding:6px;font-size:20px;line-height:1}
button.sm{padding:5px 10px;font-size:13px}
.chip{padding:4px 10px;border-radius:99px;font-size:13px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:4px}
textarea{font-size:13px;font-family:ui-monospace,monospace}
label{display:block;margin-bottom:10px;font-size:13.5px;color:var(--muted)}
label.check{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px}
label.check input{width:20px;height:20px;margin:0;flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .grow{flex:1;min-width:0}
.item .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.item .run{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.item.pay{background:var(--brand2);margin:4px -14px;padding:10px 14px;border-bottom:none;border-radius:8px}
.item.paid .grow,.item.paid .amt{opacity:.45;text-decoration:line-through}
.item.late{background:color-mix(in srgb,var(--warn) 12%,transparent);margin:0 -14px;padding:10px 14px}
.item input[type=checkbox]{width:22px;height:22px;margin:0;flex:none}
.datebox{width:42px;text-align:center;flex:none;line-height:1.1}
.datebox b{display:block;font-size:17px}
.datebox span{font-size:11px;color:var(--muted);text-transform:uppercase}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted);margin-left:4px;vertical-align:1px}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--chip);margin:8px 0 10px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}
.catbar{display:block;width:100%;text-align:left;background:none;border:none;border-radius:0;padding:8px 0;border-bottom:1px solid var(--line)}
.catbar.sel{background:var(--brand2);margin:0 -14px;padding:8px 14px;width:calc(100% + 28px)}
.cb-top{display:flex;justify-content:space-between;gap:8px}
.tgt{padding:8px 0;border-bottom:1px solid var(--line)}
.tgt:last-child{border-bottom:none}
.tgt .bar{height:10px;position:relative}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px;margin-bottom:8px}
.stats3 span{display:block;font-size:12px;color:var(--muted)}
.stats3 b{font-size:18px;font-variant-numeric:tabular-nums}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.monthnav b{font-size:17px}
.monthnav button{width:44px}
.status{border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:600}
.status.ok{background:var(--brand2);color:var(--pos)}
.status.bad{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:500;font-size:12px}
.tbl tr.total td{font-weight:700;border-bottom:none}
.tbl tr.empty td{color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:4px;touch-action:manipulation}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:8px}
.chart .ax.sel{fill:var(--ink);font-weight:700}
.chart .tot{fill:var(--ink);font-size:7px}
.chart .hl{fill:var(--chip)}
.chart .tline{stroke:var(--neg);stroke-width:1.3;stroke-dasharray:4 3}
.toggles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tg{padding:5px 10px;font-size:12.5px;border-radius:99px;background:none;color:var(--muted);border:1px solid var(--line)}
.tg::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;border:1.5px solid var(--c);margin-right:6px;vertical-align:-1px}
.tg.on{color:var(--ink);background:var(--chip)}
.tg.on::before{background:var(--c)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0;flex:none}
.dot.none{border:1.5px dashed var(--muted);width:9px;height:9px}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.seg button{border-radius:99px;padding:7px 14px;font-size:14px;white-space:nowrap;display:flex;align-items:center}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.seg button.on{color:#06130b}}
.seg button .dot{margin-right:6px}
.donutwrap{display:flex;gap:14px;align-items:center}
.donut{width:150px;height:150px;flex:none}
.donut .dc1{fill:var(--ink);font-size:17px;font-weight:750}
.donut .dc2{fill:var(--muted);font-size:10.5px}
.donut .dc2.pos{fill:var(--pos)}.donut .dc2.neg{fill:var(--neg)}
.dlegend{flex:1;min-width:0;font-size:13px}
.dlegend div{display:flex;align-items:center;gap:6px;padding:3px 0}
.dlegend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.dlegend .dn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlegend b{font-variant-numeric:tabular-nums;font-weight:600}
.dlegend small{width:32px;text-align:right}
@media (max-width:380px){.donutwrap{flex-direction:column;align-items:stretch}.donut{align-self:center}}
.seg.sm button{padding:4px 10px;font-size:12.5px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tabs button{background:none;border:none;border-radius:10px;padding:6px 0;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--brand);font-weight:650}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h3{margin:0;font-size:18px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.implist{margin-top:10px;border-top:1px solid var(--line)}
.improw{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.improw.off{opacity:.45}
.improw.priv .grow div{opacity:.6}
.improw input{width:20px;height:20px;margin:0;flex:none}
.improw .grow{flex:1;min-width:0}
.improw .grow div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.improw .amt{padding:4px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.improw .lock{padding:4px 7px;font-size:14px;opacity:.5}
.improw.priv .lock{opacity:1;background:var(--brand2);border-color:var(--brand)}
.txrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.txrow .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txrow .a{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.txrow select{grid-column:1;margin:0;padding:5px 8px;font-size:13px;width:auto;max-width:100%}
.txrow .btns{grid-column:2;justify-self:end;display:flex;gap:6px}
.txrow .btns button{font-size:12px;padding:4px 8px}
.txrow.privsum{grid-template-columns:1fr auto;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.banner{background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.sugg td,.sugg th{padding:8px 4px}
.sugg td:nth-child(2){white-space:nowrap}
details summary{cursor:pointer;color:var(--brand);font-weight:600;padding:4px 0}
ol.steps{padding-left:20px;margin:6px 0}
ol.steps li{margin-bottom:6px;font-size:14px}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header class="top">
  <span class="logo" id="logoSlot"></span>
  <h1>Free Cash</h1>
  <button id="syncBtn" data-action="syncNow"></button>
  <button class="icon" data-action="settings" aria-label="Settings &amp; backup">⚙︎</button>
</header>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Bills</button>

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.2, 1.6, 2, 2.4, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
function chartHTML() {

  let target = null; if (vis.length === 1) { const t = S.targets.find(x => x.cat === vis[0]); if (t) target = targetAmt(t); }
  const max = niceMax(Math.max(1, ...tot, target || 0));
  const W = 340, H = 190, Lp = 30, B = 16, T = 12, ch = H - T - B, cw = (W - Lp) / 12, bw = cw * .64;

  if (chartSel != null) s += `<rect class="hl" x="${Lp + chartSel * cw}" y="${T - 10}" width="${cw}" height="${ch + 10}" rx="4"/>`;
  for (let i = 0; i <= 4; i++) { const y = T + ch * (1 - i / 4); s += `<line class="grid" x1="${Lp}" x2="${W}" y1="${y}" y2="${y}"/><text class="ax" x="${Lp - 4}" y="${y + 3}" text-anchor="end">${fmtK(max * i / 4)}</text>`; }
  months.forEach((A, i) => {
    let y = T + ch; const x = Lp + i * cw + (cw - bw) / 2;
    for (const c of vis) { const v = Math.max(0, A.cats[c]?.total || 0); if (!v) continue; const h = v / max * ch; y -= h; s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${catColor(c)}"/>`; }

    s += `<text class="ax ${chartSel === i ? 'sel' : ''}" x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${MONTHS[i][0]}</text>`;
  });
  if (target) { const y = T + ch * (1 - target / max); s += `<line class="tline" x1="${Lp}" x2="${W}" y1="${y}" y2="${y}"/><text class="ax" x="${W - 2}" y="${y - 3}" text-anchor="end" style="fill:var(--neg)">target ${fmtK(target)}</text>`; }
  for (let i = 0; i < 12; i++) s += `<rect x="${Lp + i * cw}" y="0" width="${cw}" height="${H}" fill="transparent" data-action="chartSel" data-i="${i}" style="cursor:pointer"/>`;
  s += '</svg>';

// What the plan says a given month looks like: real paydays and bill due dates that fall in that month
// (so 5-Friday months and yearly bills show up), utility estimates by season, and spending targets.
function planMonth(k) {
  const [y, m] = k.split('-').map(Number), from = new Date(y, m - 1, 1), to = new Date(y, m, 0);
  let inc = 0; for (const i of S.incomes) inc += Math.min(occurrences(i, from, to).length, CHECK_CAP[i.freq] || 1) * (+i.amount || 0) * share(i.person);
  const cats = {};
  for (const b of S.bills) { const sh = share(b.payer); if (!sh) continue; for (const d of occurrences(b, from, to)) cats[b.category] = (cats[b.category] || 0) + billAmt(b, d) * sh; }
  if (view === 'all') for (const t of S.targets) if (t.cat !== 'Savings & Investing') { const g = targetAmt(t); if (g > (cats[t.cat] || 0)) cats[t.cat] = g; }
  const P = planMath(), saving = sum(P.allocs.filter(a => a.kind !== 'spending').map(a => a.amt)), fun = sum(P.allocs.filter(a => a.kind === 'spending').map(a => a.amt));
  if (fun) cats['Planned spending'] = (cats['Planned spending'] || 0) + fun;
  const exp = sum(Object.values(cats));
  return {inc, cats, exp, saving, left: inc - exp - saving};
}

function commitImport() {
  const acct = val('imp_acct'), on = pending.rows.filter(r => !r.dup);
  const totals = {};
  for (const r of on) {
    if (!r.cat) r.cat = r.amount > 0 ? 'Income' : 'Other';
    const mo = totals[r.date.slice(0, 7)] = totals[r.date.slice(0, 7)] || {};
    const v = mo[r.cat] = mo[r.cat] || [0, 0]; v[0] = Math.round((v[0] - r.amount) * 100) / 100; v[1]++;
  }
  if (pending.remember) for (const r of on.filter(r => r.manual)) {
    const mk = merchantKey(r.desc);
    if (mk.length >= 3 && !S.learned.some(x => x.match === mk && x.category === r.cat)) upsert('learned', {id: 'r|' + mk, match: mk, category: r.cat});
  }
  saveLocal();
  // bill amounts found in the statement → that month's actual bill (never overwrites one you typed in)
  const billSums = {}, learn = {};
  for (const r of on) { const m = billOf(r); if (!m) continue; const key = billKeyFor(m.b, r.date); billSums[key] = (billSums[key] || 0) + -r.amount; if (m.how === 'you') learn[m.b.id] = merchantKey(r.desc); }
  for (const [key, amt] of Object.entries(billSums)) {
    const old = S.billLogs.find(l => l.id === 'bl|' + key); if (old && old.src !== 'bank') continue;
    const [bid, ds] = key.split('|'); upsert('billLogs', {id: 'bl|' + key, billId: bid, date: ds, amount: Math.round(amt * 100) / 100, src: 'bank'});
  }
  for (const [bid, mk] of Object.entries(learn)) { const b = S.bills.find(x => x.id === bid); if (b && mk.length >= 3 && !b.match) upsert('bills', Object.assign({}, b, {match: mk})); }
  upsert('imports', {id: uid(), at: ymd(today()), account: acct || 'Statement', owner: pending.owner || null, n: on.length, totals, keys: on.map(r => hash(txKey(r))).sort()});
  save(); closeModal();
  spendMonth = Object.keys(totals).sort().pop() || spendMonth; tab = 'spend';
  pending = null; render(); toast(`Saved totals from ${on.length} transactions`);
}

async function connectGh() {
  const code = val('g_code'); let g;
  if (code) {
    try { const j = JSON.parse(atob(code.replace(/^FC1:/, '').trim())); g = {owner: j.o, repo: j.r, token: j.t, path: j.p || 'freecash.json'}; }
    catch (e) { return toast("That setup code doesn't look right"); }
  } else g = {owner: val('g_owner'), repo: val('g_repo'), token: val('g_token'), path: 'freecash.json'};
  g.pass = $('g_pass').value;
  if (!g.owner || !g.repo || !g.token) return toast('Fill in username, repo and token (or paste a setup code)');
  if (g.pass.length < 8) return toast('Use a passphrase of at least 8 characters');
  if (!window.crypto?.subtle) return toast('Encryption needs the app to be opened over https');
  toast('Connecting…');
  try {
    const r = await gh(g, 'GET', ''); if (!r.ok) throw ghError(r);
    const repo = await r.json();
    if (!repo.private && !confirm('That repo is PUBLIC. The data is encrypted, but it should still be private. Continue anyway?')) return;
    L.gh = g; saveLocal();
    await sync({first: true});
    toast('Sync is on'); settings(); render();
  } catch (e) {
    L.gh = null; saveLocal(); setSync('off');
    toast(e.pass ? "Passphrase doesn't match the one the other phone used" : e.message);
  }
}

document.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; showDrop(false); } });
document.addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0; showDrop(false);
  const files = [...(e.dataTransfer?.files || [])]; if (!files.length) return;
  const statements = [];
  for (const f of files) {
    if (!/\.pdf$/i.test(f.name)) { statements.push(f); continue; }
    try {
      const lines = await pdfLines(await f.arrayBuffer());
      if (parsePdfStatement(lines).length >= 3) statements.push(f);
      else stubForm(null, Object.assign({who: S.incomes[0]?.name || '', fromFile: true}, parsePaystub(lines.join('\n'))));
    } catch (err) { toast(f.name + ': ' + err.message); }
  }
  if (statements.length) handleStatementFiles(statements);
});
$('filePaystub').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    toast('Reading paystub…');
    const text = /\.pdf$/i.test(f.name) ? (await pdfLines(await f.arrayBuffer())).join('\n') : await f.text();
    stubForm(null, Object.assign({who: S.incomes[0]?.name || '', fromFile: true}, parsePaystub(text)));
  } catch (err) { toast(err.message); stubForm(null); }
});
$('fileRestore').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.bills)) throw new Error('Not a Free Cash backup file');
    if (!confirm(`Load this backup?\n${d.bills.length} bills · ${(d.imports || []).length + (d.txns?.length ? 1 : 0)} statement imports${L.gh ? '\n\nIt will be merged with the synced data.' : '\n\nThis replaces what is on this phone.'}`)) return;
    S = L.gh ? merge(S, migrate(d)) : migrate(d); save(); closeModal(); tab = 'home'; render(); toast('Backup loaded');
  } catch (err) { toast(err.message); }
});
render();
if (L.gh) { setSync('busy', 'Syncing…'); sync(); }
</script>
</body>
</html>
